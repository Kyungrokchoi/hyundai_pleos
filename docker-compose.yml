# PostgreSQL for local development.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: moata
      POSTGRES_PASSWORD: ${MOATA_DB_PASSWORD:?set MOATA_DB_PASSWORD}
      POSTGRES_DB: moata
    ports: ["127.0.0.1:5432:5432"]
    volumes: [moata-pg:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U moata"], interval: 5s, retries: 10 }
volumes:
  moata-pg:
