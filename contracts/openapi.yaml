components:
  schemas:
    Allocation:
      type: string
      enum:
      - EQUAL
      - DISTANCE_WEIGHTED
      - DRIVER_ONLY
      title: Allocation
    ApprovalIn:
      properties:
        decision:
          $ref: '#/components/schemas/Decision'
        comment:
          type: string
          maxLength: 100
          title: Comment
          default: ''
      additionalProperties: false
      type: object
      required:
      - decision
      title: ApprovalIn
    ApprovalState:
      type: string
      enum:
      - PENDING
      - APPROVED
      - DISPUTED
      title: ApprovalState
    AuthOut:
      properties:
        user_id:
          type: string
          title: User Id
        nickname:
          type: string
          title: Nickname
        token:
          type: string
          title: Token
          description: Opaque bearer token. Shown once; only its hash is stored.
        expires_at:
          type: string
          format: date-time
          title: Expires At
      additionalProperties: false
      type: object
      required:
      - user_id
      - nickname
      - token
      - expires_at
      title: AuthOut
    BadgeOut:
      properties:
        id:
          type: string
          title: Id
        name_ko:
          type: string
          title: Name Ko
        description_ko:
          type: string
          title: Description Ko
        earned_at:
          type: string
          format: date-time
          title: Earned At
      additionalProperties: false
      type: object
      required:
      - id
      - name_ko
      - description_ko
      - earned_at
      title: BadgeOut
    BadgeStatusOut:
      properties:
        id:
          type: string
          title: Id
        name_ko:
          type: string
          title: Name Ko
        description_ko:
          type: string
          title: Description Ko
        earned:
          type: boolean
          title: Earned
        earned_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Earned At
      additionalProperties: false
      type: object
      required:
      - id
      - name_ko
      - description_ko
      - earned
      title: BadgeStatusOut
    BoardingIn:
      properties:
        odometer_km:
          anyOf:
          - type: number
            maximum: 9999999.0
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Odometer Km
          description: Driver-only override; passengers use the server's latest reading.
        reason:
          type: string
          maxLength: 60
          title: Reason
          default: ''
        undo:
          type: boolean
          title: Undo
          description: 'Alight only: the rider''s ''잘못 눌렀어요''. Forgets the boarding
            if the car has not moved since it began.'
          default: false
      additionalProperties: false
      type: object
      title: BoardingIn
    CharacterOut:
      properties:
        group_id:
          type: string
          title: Group Id
        name:
          type: string
          title: Name
          default: 모아
        xp:
          type: integer
          title: Xp
        level:
          type: integer
          title: Level
        level_xp_start:
          type: integer
          title: Level Xp Start
        next_level_xp:
          anyOf:
          - type: integer
          - type: 'null'
          title: Next Level Xp
        skin_id:
          type: string
          title: Skin Id
        mood:
          type: string
          enum:
          - SLEEPY
          - HAPPY
          - PROUD
          title: Mood
        badges:
          items:
            $ref: '#/components/schemas/BadgeOut'
          type: array
          title: Badges
          description: Earned badges only, oldest first.
        all_badges:
          items:
            $ref: '#/components/schemas/BadgeStatusOut'
          type: array
          title: All Badges
          description: Every badge in catalogue order with whether the group earned
            it.
        completed_trips:
          type: integer
          title: Completed Trips
        note_ko:
          type: string
          title: Note Ko
          default: 모아는 함께 정산을 마친 이동 기록으로만 자랍니다. 거리·속도와는 관계없어요.
      additionalProperties: false
      type: object
      required:
      - group_id
      - xp
      - level
      - level_xp_start
      - next_level_xp
      - skin_id
      - mood
      - badges
      - completed_trips
      title: CharacterOut
    CostItemIn:
      properties:
        id:
          type: string
          maxLength: 64
          minLength: 8
          pattern: ^[A-Za-z0-9_-]+$
          title: Id
        kind:
          $ref: '#/components/schemas/ItemKind'
        amount_krw:
          type: integer
          maximum: 100000000.0
          minimum: 0.0
          title: Amount Krw
        allocation:
          $ref: '#/components/schemas/Allocation'
          default: EQUAL
        note:
          type: string
          maxLength: 60
          title: Note
          default: ''
        road_name:
          type: string
          maxLength: 40
          title: Road Name
          description: Road / tunnel the charge belongs to, e.g. `서울→수원`.
          default: ''
        estimated:
          type: boolean
          title: Estimated
          description: True when the amount was computed (toll estimate), not read
            off a receipt.
          default: false
      additionalProperties: false
      type: object
      required:
      - id
      - kind
      - amount_krw
      title: CostItemIn
    CostItemOut:
      properties:
        id:
          type: string
          title: Id
        kind:
          $ref: '#/components/schemas/ItemKind'
        amount_krw:
          type: integer
          title: Amount Krw
        allocation:
          $ref: '#/components/schemas/Allocation'
        note:
          type: string
          title: Note
        road_name:
          type: string
          title: Road Name
          default: ''
        estimated:
          type: boolean
          title: Estimated
          default: false
        input_source:
          type: string
          enum:
          - MANUAL
          - ESTIMATE
          title: Input Source
          default: MANUAL
        created_by:
          type: string
          title: Created By
      additionalProperties: false
      type: object
      required:
      - id
      - kind
      - amount_krw
      - allocation
      - note
      - created_by
      title: CostItemOut
    CostRuleIn:
      properties:
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        efficiency_value:
          anyOf:
          - type: number
            maximum: 100000.0
            exclusiveMinimum: 0.0
          - type: string
          - type: 'null'
          title: Efficiency Value
          description: Number in `efficiency_unit`. Only for MANUAL.
        efficiency_unit:
          anyOf:
          - type: string
            enum:
            - km/L
            - L/100km
            - km/kWh
            - Wh/km
            - kWh/100km
          - type: 'null'
          title: Efficiency Unit
        efficiency_source:
          $ref: '#/components/schemas/EfficiencySource'
          description: 'ESTIMATE = nothing is typed in: the car''s own reading is
            used if it reports one, otherwise the rated average for `fuel_type`. PLEOS/DEMO
            = readings only. MANUAL = `efficiency_value` is required.'
          default: MANUAL
        fuel_type:
          anyOf:
          - type: string
            enum:
            - GASOLINE
            - DIESEL
            - LPG
            - ELECTRIC
          - type: 'null'
          title: Fuel Type
          description: Required for ESTIMATE; ELECTRIC if and only if vehicle_type
            is EV.
        unit_price_krw:
          anyOf:
          - type: number
            maximum: 100000.0
            minimum: 0.0
          - type: string
          - type: 'null'
          title: Unit Price Krw
          description: KRW per litre (ICE) or per kWh (EV).
        unit_price_source:
          type: string
          enum:
          - MANUAL
          - OPINET
          title: Unit Price Source
          description: OPINET = filled from GET /fuel-price, MANUAL = typed in.
          default: MANUAL
        driver_included:
          type: boolean
          title: Driver Included
          default: true
        energy_policy:
          $ref: '#/components/schemas/EnergyPolicy'
          default: SEGMENT_SHARED
      additionalProperties: false
      type: object
      required:
      - vehicle_type
      title: CostRuleIn
    CostRuleOut:
      properties:
        vehicle_type:
          $ref: '#/components/schemas/VehicleType'
        efficiency_value:
          anyOf:
          - type: string
          - type: 'null'
          title: Efficiency Value
        efficiency_unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Efficiency Unit
        efficiency_km_per_unit:
          anyOf:
          - type: string
          - type: 'null'
          title: Efficiency Km Per Unit
          description: Normalised km/L (ICE) or km/kWh (EV) actually used.
        efficiency_source:
          $ref: '#/components/schemas/EfficiencySource'
          description: Source of the figure actually used (a reading from the car
            wins over the rated average).
        fuel_type:
          anyOf:
          - type: string
            enum:
            - GASOLINE
            - DIESEL
            - LPG
            - ELECTRIC
          - type: 'null'
          title: Fuel Type
        unit_price_krw:
          anyOf:
          - type: string
          - type: 'null'
          title: Unit Price Krw
        unit_price_source:
          type: string
          enum:
          - MANUAL
          - OPINET
          title: Unit Price Source
          default: MANUAL
        driver_included:
          type: boolean
          title: Driver Included
        energy_policy:
          $ref: '#/components/schemas/EnergyPolicy'
      additionalProperties: false
      type: object
      required:
      - vehicle_type
      - efficiency_value
      - efficiency_unit
      - efficiency_km_per_unit
      - efficiency_source
      - unit_price_krw
      - driver_included
      - energy_policy
      title: CostRuleOut
    CouponOut:
